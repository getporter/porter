name: integ reusable workflow

# Builds Porter once, then runs the integration tests in parallel shards.
# Shards are defined in .github/integration-shards.json.
on:
  workflow_call:
    inputs:
      registry:
        type: string
        default: ghcr.io

permissions:
  contents: read
  packages: read

jobs:
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Check every integration test file is in a shard
        run: scripts/check-integration-shards.sh
        shell: bash
      - name: Build matrix
        id: matrix
        run: |
          matrix=$(jq -c '{include: [.[] | {name, files: (.files | map(. + ".go") | join(" "))}]}' .github/integration-shards.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        shell: bash

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker Login
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{inputs.registry}}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Agent
        run: go run mage.go build
        shell: bash
      # upload-artifact doesn't preserve file modes, so archive bin/ first
      - name: Archive bin
        run: tar -czf bin.tgz bin
        shell: bash
      - name: Upload bin
        uses: actions/upload-artifact@v4
        with:
          name: porter-bin
          path: bin.tgz
          retention-days: 1
          compression-level: 0

  test:
    name: ${{ matrix.name }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PORTER_INTEG_FILE: ${{ matrix.files }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker Login
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{inputs.registry}}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download bin
        uses: actions/download-artifact@v4
        with:
          name: porter-bin
      - name: Extract bin
        run: tar -xzf bin.tgz && rm bin.tgz
        shell: bash
      - name: Aggressive cleanup
        run: |
          df -h
          # Remove Java (JDKs)
          sudo rm -rf /usr/lib/jvm
          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet
          # Remove Swift toolchain
          sudo rm -rf /usr/share/swift
          # Remove Haskell (GHC)
          sudo rm -rf /usr/local/.ghcup
          # Remove Julia
          sudo rm -rf /usr/local/julia*
          # Remove Android SDKs
          sudo rm -rf /usr/local/lib/android
          # Remove Chromium (optional if not using for browser tests)
          sudo rm -rf /usr/local/share/chromium
          # Remove Microsoft/Edge and Google Chrome builds
          sudo rm -rf /opt/microsoft /opt/google
          # Remove Azure CLI
          sudo rm -rf /opt/az
          # Remove PowerShell
          sudo rm -rf /usr/local/share/powershell
          df -h
        shell: bash
      - name: Integration Test
        run: go run mage.go -v TestIntegration
        shell: bash
