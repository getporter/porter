name: porter/porter-integration
on:
  workflow_call:
    inputs:
      registry:
        type: string
        required: false
        default: ghcr.io

permissions:
  contents: read
  packages: read

jobs:
  tests:
    name: Integration Tests
    uses: getporter/porter/.github/workflows/integ-reuseable-workflow.yml@main
    with:
      registry: ${{inputs.registry}}

  # Single required check, so changing shards never requires touching branch protection
  integration:
    name: integration
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check shards passed
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "integration tests: ${{ needs.tests.result }}"
            exit 1
          fi
        shell: bash
