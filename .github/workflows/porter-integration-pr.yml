name: porter/porter-integration
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - "netlify.toml"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - "netlify.toml"

permissions:
  contents: read
  packages: read

jobs:
  tests:
    name: Integration Tests
    uses: ./.github/workflows/integ-reuseable-workflow.yml

  # Single required check, so changing shards never requires touching branch protection
  integration:
    name: integration
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check shards passed
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "integration tests: ${{ needs.tests.result }}"
            exit 1
          fi
        shell: bash
