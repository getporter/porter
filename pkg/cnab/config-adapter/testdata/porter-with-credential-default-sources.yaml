schemaVersion: 1.0.1
name: credbun
version: 0.1.0
description: "bundle that suggests where to find its credentials"
registry: "localhost:5000"

mixins:
  - exec

credentials:
  - name: kubeconfig
    path: /home/nonroot/.kube/config
    defaultSource:
      path: ~/.kube/config
  - name: token
    env: GITHUB_TOKEN
    defaultSource:
      env: GITHUB_TOKEN
  - name: password
    env: PASSWORD

install:
  - exec:
      description: "install"
      command: ls

uninstall:
  - exec:
      description: "uninstall"
      command: ls
